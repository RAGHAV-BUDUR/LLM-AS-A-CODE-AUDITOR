[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B45"
linkColor = "#1D4ED8"
borderColor = "#D7E1EC"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 18
baseFontWeight = 400
headingFontSizes = ["2.6rem", "2.1rem", "1.7rem", "1.4rem", "1.2rem", "1rem"]
headingFontWeights = [700, 650, 600, 600, 550, 500]
metricValueFontSize = "3rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
paddingBottom = "3rem"
chartCategoricalColors = ["#1D4ED8", "#0E7490", "#B45309", "#4F46E5", "#15803D", "#BE123C"]
dataframeBorderColor = "#D7E1EC"
dataframeHeaderBackgroundColor = "#EAF0F7"
dataframeHeaderTextColor = "#172B45"

[theme.sidebar]
backgroundColor = "#0B1F3A"
secondaryBackgroundColor = "#142B49"
textColor = "#F8FAFC"
primaryColor = "#2563EB"
linkColor = "#BFDBFE"
borderColor = "#294666"
codeBackgroundColor = "#142B49"
codeTextColor = "#F8FAFC"
paddingTop = "1rem"
paddingBottom = "1.5rem"
headingFontSizes = ["1.6rem", "1.3rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 550, 500]
